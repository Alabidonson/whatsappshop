<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer mon compte — WhatsAppShop</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">
                🛍️ WhatsAppShop
            </a>

            <div class="auth-header">
                <h1>Créer mon compte</h1>
                <p>
                    Rejoins WhatsAppShop et commence à créer ta boutique.
                </p>
            </div>

            <form id="register-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="first-name">Prénom</label>

                        <input type="text" id="first-name" placeholder="Ton prénom" required>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Nom</label>

                        <input type="text" id="last-name" placeholder="Ton nom" required>
                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input type="email" id="email" placeholder="exemple@email.com" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" placeholder="Minimum 6 caractères" minlength="6" required>

                        <button type="button" class="password-toggle" data-target="password">
                            👁️
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirmer le mot de passe
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="confirm-password" placeholder="Répète ton mot de passe" minlength="6"
                            required>

                        <button type="button" class="password-toggle" data-target="confirm-password">
                            👁️
                        </button>

                    </div>

                </div>


                <div id="register-message" class="auth-message"></div>


                <button type="submit" class="btn btn-primary auth-submit">
                    Créer mon compte
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Tu as déjà un compte ?
                    <a href="login.html">
                        Se connecter
                    </a>
                </p>

                <a href="../index.html" class="back-link">
                    ← Retour à l'accueil
                </a>

            </div>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration Supabase -->
    <script src="../js/supabase.js"></script>

    <!-- Authentification -->
    <script src="../js/auth.js"></script>

</body>

</html>
